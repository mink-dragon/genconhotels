<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 52" width="320" height="52">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#388bfd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- D20 die body -->
  <polygon points="26,3 47,14 47,36 26,49 5,36 5,14" fill="url(#diceGrad)" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Top face triangle -->
  <polygon points="26,3 47,14 5,14" fill="#ffffff" opacity="0.07"/>

  <!-- Left face -->
  <polygon points="5,14 26,3 26,26" fill="#000000" opacity="0.15"/>

  <!-- Right face -->
  <polygon points="47,14 26,3 26,26" fill="#ffffff" opacity="0.05"/>

  <!-- Center diamond outline -->
  <polygon points="26,14 36,22 36,33 26,41 16,33 16,22" fill="#0d1117" opacity="0.35"/>

  <!-- "20" label -->
  <text x="26" y="33" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" filter="url(#glow)">20</text>

  <!-- Vertical divider -->
  <line x1="56" y1="6" x2="56" y2="46" stroke="#30363d" stroke-width="1"/>

  <!-- GEN CON wordmark -->
  <text x="66" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">GEN CON</text>

  <!-- TRACKER subtext -->
  <text x="68" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="url(#glowGrad)" letter-spacing="5">TRACKER</text>
</svg>
