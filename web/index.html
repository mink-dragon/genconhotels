<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenCon 2026 Hotel Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 { font-size: 1.4rem; font-weight: 700; color: #f0f6fc; }
        header h1 span { color: #58a6ff; }

        .last-updated { font-size: 0.8rem; color: #8b949e; }

        .pulse {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #3fb950;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 20px;
            min-width: 120px;
        }

        .stat-card .value { font-size: 1.8rem; font-weight: 700; }
        .stat-card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card.added .value    { color: #3fb950; }
        .stat-card.removed .value  { color: #f85149; }
        .stat-card.skywalk .value  { color: #58a6ff; }
        .stat-card.downtown .value { color: #3fb950; }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .controls label { font-size: 0.85rem; color: #8b949e; margin-right: 4px; }

        .filter-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .filter-btn:hover { background: #30363d; border-color: #8b949e; }
        .filter-btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }

        .table-wrap {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        thead { background: #1c2128; }

        th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #30363d;
            white-space: nowrap;
        }

        td { padding: 10px 14px; border-bottom: 1px solid #21262d; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        tr.added   { background: rgba(63, 185, 80, 0.05); }
        tr.removed { background: rgba(248, 81, 73, 0.05); }
        tr.added:hover   { background: rgba(63, 185, 80, 0.1); }
        tr.removed:hover { background: rgba(248, 81, 73, 0.1); }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.added    { background: rgba(63, 185, 80, 0.15);  color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .badge.removed  { background: rgba(248, 81, 73, 0.15);  color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
        .badge.sw       { background: rgba(88, 166, 255, 0.15); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.3); margin-left: 4px; }
        .badge.dt       { background: rgba(63, 185, 80, 0.15);  color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); margin-left: 4px; }

        .hotel-name { font-weight: 500; }
        .hotel-name.skywalk  { color: #58a6ff; }
        .hotel-name.downtown { color: #3fb950; }

        .rate { font-weight: 600; color: #f0f6fc; }
        .dist { color: #8b949e; white-space: nowrap; }
        .timestamp { color: #8b949e; white-space: nowrap; font-size: 0.8rem; }

        .empty { text-align: center; padding: 48px; color: #8b949e; }
        .error { text-align: center; padding: 48px; color: #f85149; }
    </style>
</head>
<body>
    <header>
        <h1>🎲 GenCon <span>2026</span> Hotel Tracker</h1>
        <div class="last-updated">
            <span class="pulse"></span>
            <span id="last-updated">Loading...</span>
        </div>
    </header>

    <div class="container">
        <div class="stats-row">
            <div class="stat-card added">
                <div class="value" id="stat-added">—</div>
                <div class="label">Added</div>
            </div>
            <div class="stat-card removed">
                <div class="value" id="stat-removed">—</div>
                <div class="label">Removed</div>
            </div>
            <div class="stat-card skywalk">
                <div class="value" id="stat-skywalk">—</div>
                <div class="label">Skywalk</div>
            </div>
            <div class="stat-card downtown">
                <div class="value" id="stat-downtown">—</div>
                <div class="label">Downtown</div>
            </div>
        </div>

        <div class="controls">
            <label>Filter:</label>
            <button class="filter-btn" data-filter="24h">24 Hours</button>
            <button class="filter-btn" data-filter="7d">7 Days</button>
            <button class="filter-btn" data-filter="30d">30 Days</button>
            <button class="filter-btn active" data-filter="all">All Time</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Type</th>
                        <th>Hotel</th>
                        <th>Room</th>
                        <th>Rate</th>
                        <th>Distance</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const JSONL_URL = '/changes.jsonl';
        const REFRESH_INTERVAL = 5000;
        let currentFilter = 'all';
        let allEvents = [];

        function parseJSONL(text) {
            return text.trim().split('\n')
                .filter(line => line.trim())
                .map(line => { try { return JSON.parse(line); } catch { return null; } })
                .filter(Boolean)
                .reverse();
        }

        function filterEvents(events, filter) {
            if (filter === 'all') return events;
            const now = new Date();
            const cutoffs = {
                '24h': new Date(now - 24 * 60 * 60 * 1000),
                '7d':  new Date(now - 7  * 24 * 60 * 60 * 1000),
                '30d': new Date(now - 30 * 24 * 60 * 60 * 1000),
            };
            return events.filter(e => new Date(e.timestamp) >= cutoffs[filter]);
        }

        function formatTimestamp(ts) {
            return new Date(ts).toLocaleString('en-US', {
                timeZone: 'America/New_York',
                month: '2-digit', day: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: true
            }) + ' EST';
        }

        function updateStats(events) {
            document.getElementById('stat-added').textContent    = events.filter(e => e.type === 'added').length;
            document.getElementById('stat-removed').textContent  = events.filter(e => e.type === 'removed').length;
            document.getElementById('stat-skywalk').textContent  = events.filter(e => e.skywalk === 1).length;
            document.getElementById('stat-downtown').textContent = events.filter(e => e.downtown === 1).length;
        }

        function renderTable(events) {
            const tbody = document.getElementById('table-body');
            if (events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">No events in this time range.</td></tr>';
                return;
            }
            tbody.innerHTML = events.map(e => {
                const hotelClass  = e.skywalk === 1 ? 'skywalk' : e.downtown === 1 ? 'downtown' : '';
                const dtswBadge   = e.skywalk === 1
                    ? '<span class="badge sw">SW</span>'
                    : e.downtown === 1
                    ? '<span class="badge dt">DT</span>'
                    : '';
                return `
                    <tr class="${e.type}">
                        <td class="timestamp">${formatTimestamp(e.timestamp)}</td>
                        <td><span class="badge ${e.type}">${e.type === 'added' ? '+ Added' : '− Removed'}</span></td>
                        <td><span class="hotel-name ${hotelClass}">${e.hotel_name}</span>${dtswBadge}</td>
                        <td>${e.room_name || '—'}</td>
                        <td class="rate">$${e.rate}</td>
                        <td class="dist">${e.distance} mi</td>
                    </tr>`;
            }).join('');
        }

        function updateLastUpdated() {
            document.getElementById('last-updated').textContent = 'Last updated: ' +
                new Date().toLocaleString('en-US', {
                    timeZone: 'America/New_York',
                    month: '2-digit', day: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: true
                }) + ' EST';
        }

        async function fetchAndRender() {
            try {
                const res = await fetch(JSONL_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allEvents = parseJSONL(await res.text());
                const filtered = filterEvents(allEvents, currentFilter);
                updateStats(filtered);
                renderTable(filtered);
                updateLastUpdated();
            } catch (err) {
                document.getElementById('table-body').innerHTML =
                    `<tr><td colspan="6" class="error">Error loading data: ${err.message}<br>Make sure changes.jsonl is accessible.</td></tr>`;
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                const filtered = filterEvents(allEvents, currentFilter);
                updateStats(filtered);
                renderTable(filtered);
            });
        });

        fetchAndRender();
        setInterval(fetchAndRender, REFRESH_INTERVAL);
    </script>
</body>
</html>
